name: Build NoticeFix APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7 (no cache, no develocity)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true
          develocity-injection-enabled: false

      - name: Diagnose gradle full trace
        run: |
          echo "=== gradle home ==="
          ls -la /home/runner/.gradle/ 2>/dev/null | head -10
          echo "=== run gradle help (full log) ==="
          gradle help --no-daemon --info > /tmp/gradle.log 2>&1 || true
          echo "=== gradle.log lines: $(wc -l < /tmp/gradle.log) ==="
          grep -nE "dl\.google|GET|HEAD|Resource|404|403|500|trying|repository|resolve|plugin" /tmp/gradle.log | head -50
          echo "=== last 25 lines ==="
          tail -25 /tmp/gradle.log

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoticeFix-fankes-mod
          path: app/build/outputs/apk/release/*.apk
