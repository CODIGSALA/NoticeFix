name: Build NoticeFix APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7 (no cache, no develocity)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true
          develocity-injection-enabled: false

      - name: Diagnose proxy env & gradle info
        run: |
          echo "=== proxy env ==="
          env | grep -iE "proxy" || echo "no proxy env vars"
          echo "=== java version ==="
          java -version 2>&1
          echo "=== gradle resolve trace ==="
          gradle help --no-daemon --info > /tmp/gradle.log 2>&1
          echo "gradle exit: $?"
          grep -iE "dl.google|maven-metadata|Could not GET|repository.*http|Connection|trying repo" /tmp/gradle.log | head -30

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoticeFix-fankes-mod
          path: app/build/outputs/apk/release/*.apk
