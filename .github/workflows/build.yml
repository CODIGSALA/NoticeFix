name: Build NoticeFix APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 7.4 (no cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.4'
          cache-disabled: true

      - name: Diagnose (GET full pom)
        run: |
          curl -s --max-time 15 "https://dl.google.com/dl/android/maven2/com/android/application/com.android.application.gradle.plugin/7.3.1/com.android.application.gradle.plugin-7.3.1.pom" | head -20

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --info 2>&1 | grep -iE "dl.google|http|error|FAILURE|not found|Could not" | head -40

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoticeFix-fankes-mod
          path: app/build/outputs/apk/release/*.apk
