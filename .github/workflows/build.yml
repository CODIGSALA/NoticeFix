name: Build NoticeFix APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle manually (bypass gradle-actions injection)
        run: |
          echo "=== download gradle ==="
          curl -sL --max-time 120 -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.7-bin.zip"
          ls -la /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          /opt/gradle/gradle-8.7/bin/gradle --version | head -6

      - name: Verify repo reachability
        run: |
          curl -s --max-time 15 "https://dl.google.com/dl/android/maven2/com/android/application/com.android.application.gradle.plugin/8.5.2/com.android.application.gradle.plugin-8.5.2.pom" | head -3
          echo "---maven-metadata---"
          curl -s --max-time 15 "https://dl.google.com/dl/android/maven2/com/android/application/com.android.application.gradle.plugin/maven-metadata.xml" | head -5

      - name: Build release APK
        run: |
          set -o pipefail
          export PATH=/opt/gradle/gradle-8.7/bin:$PATH
          export JAVA_HOME=$JAVA_HOME_17_X64
          gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoticeFix-fankes-mod
          path: app/build/outputs/apk/release/*.apk
